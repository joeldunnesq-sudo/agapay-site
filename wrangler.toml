bucket_name = "agapay-campaign-assets-staging"

[[env.staging.r2_buckets]]
binding = "TEACHING_ASSETS"
bucket_name = "agapay-teaching-assets-staging"

[[env.staging.r2_buckets]]
binding = "GROUP_MESSAGE_ASSETS"
bucket_name = "agapay-group-message-assets-staging"

[[env.staging.r2_buckets]]
binding = "PARISH_LIBRARY_ASSETS"
bucket_name = "agapay-group-message-assets-staging"

[[env.staging.r2_buckets]]
