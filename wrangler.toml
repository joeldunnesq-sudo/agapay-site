name = "agapay-site"
main = "src/worker.js"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
AGAPAY_FROM_EMAIL = "AGAPAY <onboarding@agapay.app>"
AGAPAY_REPLY_TO_EMAIL = "support@agapay.app"
AGAPAY_OPS_ALERT_EMAIL = "joeldunnesq@gmail.com"
AGAPAY_SCHEDULED_ALERT_DEDUPE_SECONDS = "3600"
AGAPAY_REGISTRATION_NOTIFY_EMAIL = "hello@agapay.app"
AGAPAY_APP_URL = "https://agapay.app"
AGAPAY_PUBLIC_URL = "https://agapay.app"
AGAPAY_ENVIRONMENT = "production"
AGAPAY_PARISH_LIFE_ENABLED = "true"
AGAPAY_CORS_ORIGIN = "https://agapay.app"
CLOUDFLARE_ACCOUNT_ID = "9198ae5ea8adc59e5dedd1b09c9478b9"
ACCOUNTING_DATABASE_BINDINGS = '{"agapay-acct-production-4ab22bac06dca8b80e70":"ACCOUNTING_DB_ST_FIACRE","agapay-acct-production-e4601e1d985ec8dcb9fe":"ACCOUNTING_DB_PHASE_G_CANARY"}'
ACCOUNTING_CANARY_PARISH_ID = "agapay-phase-g-canary"
ACCOUNTING_ALERT_EMAIL = "joeldunnesq@gmail.com"
ACCOUNTING_BACKUP_RETENTION_DAYS = "365"
NONPROFIT_PRICING_ALERT_EMAIL = "joeldunnesq@gmail.com"
TURNSTILE_SITE_KEY = "0x4AAAAAADgGWu1JfBKOSH_g"
CAMPAIGN_ASSETS_URL = "https://agapay.app/api/public/parish-assets/campaign"
ANNOUNCEMENT_ASSETS_URL = "https://agapay.app/api/public/parish-assets/announcement"
TEACHING_ASSETS_URL = "https://agapay.app/api/public/parish-assets/teaching"
AGAPAY_ENABLED_PRODUCTS = "give,learn,listen"
ANDROID_APP_PACKAGE_ID = "app.agapay.myagapay"
APPLE_APP_BUNDLE_ID = "app.agapay.myagapay"
# --- Phase 3B feature flags (all default OFF/false; see src/lib/tax-codes.js,
# src/learn/billing.js, src/lib/commerce-readiness.js for what each gates) ---
SUBSCRIPTION_TAX_CODES_ENABLED = "false"
LEARN_PERSISTED_CUSTOMER_ENFORCED = "false"
PARISH_COMMERCE_READINESS_ENABLED = "false"
PARISH_COMMERCE_READINESS_ENFORCED_FOR_NEW = "false"
PARISH_COMMERCE_READINESS_ENFORCED_FOR_ALL = "false"
# --- Phase 3C: top-level exemption-workflow kill switches ---
TAX_EXEMPTION_WORKFLOW_ENABLED = "true"
TAX_EXEMPTION_DOCUMENT_UPLOAD_ENABLED = "true"
TAX_EXEMPTION_STRIPE_SYNC_ENABLED = "true"
PRIVILEGED_MFA_REQUIRED = "true"
# Ordinary downloadable exports are active. Closure remains separately gated.
PARISH_PORTABILITY_ENABLED = "true"
PARISH_STORAGE_GUARDS_ENABLED = "false"
# Enable guards with automatic closure only after the remaining manual-copy and
# retention-disclosure approvals; ordinary exports do not require them.
PARISH_AUTOMATIC_CLOSURE_ENABLED = "false"
PARISH_PUBLIC_MEDIA_DELIVERY_ENABLED = "2026-08-28-active-storage-v2"
# Set only after all historical references are rewritten and every r2.dev origin
# is disabled and read back. Its absence keeps closure/cache disposal blocked.
PARISH_R2_DEV_PUBLIC_ACCESS_DISABLED = "2026-08-28-active-storage-v2"
# Independent R2 closure authority. This identifier is not a credential; the
# matching authority.json object is protected by an indefinite bucket lock.
PARISH_SUPPRESSION_AUTHORITY = "25a7aefe-a931-456b-ac59-62d538428e9a"
# Separate cron gate: false preserves the deployed newest-backup exception.
ACCOUNTING_BACKUP_STRICT_EXPIRY_ENABLED = "false"

[[services]]
binding = "ACCOUNTING_PROVISIONER"
service = "agapay-accounting-provisioner"
entrypoint = "AccountingProvisionerService"

[triggers]
crons = ["0 8 * * *", "0 14 * * *", "0 14 * * 6", "*/5 * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [
  "/.well-known/apple-app-site-association",
  "/apple-app-site-association",
  "/**.html",
  "/design",
  "/images/design/*",
  "/learn",
  "/myagapay",
  "/myagapay/*",
  "/donor",
  "/donor/*",
  "/give",
  "/give/*",
  "/my-agapay",
  "/my-agapay/*",
  "/learn/dashboard",
  "/learn/dashboard/*",
  "/learn/planner",
  "/learn/formation",
  "/learn/books",
  "/learn/grades",
  "/learn/community",
  "/learn/reports",
  "/learn/print-center",
  "/learn/onboarding",
  "/learn/co-op",
  "/learn/odyssey",
  "/learn/odyssey/*",
  "/listen",
  "/listen/*"
]

[[kv_namespaces]]
binding = "AGAPAY_REGISTRATIONS"
id = "c0c630d2699a4d42a72db927c6341707"

[[d1_databases]]
binding = "AGAPAY_DB"
database_name = "agapay-production"
database_id = "24f514a6-6904-425b-a4c8-b3584b23c0be"

[[d1_databases]]
binding = "ACCOUNTING_DB_ST_FIACRE"
database_name = "agapay-acct-production-4ab22bac06dca8b80e70"
database_id = "7d3a6a59-f622-4303-9e84-e1074879d11d"
migrations_dir = "accounting-migrations"
migrations_table = "_agapay_d1_migrations"

[[d1_databases]]
binding = "ACCOUNTING_DB_PHASE_G_CANARY"
database_name = "agapay-acct-production-e4601e1d985ec8dcb9fe"
database_id = "0b55d572-7dbc-4f6d-97a5-826841f4bbb8"
migrations_dir = "accounting-migrations"
migrations_table = "_agapay_d1_migrations"

[[r2_buckets]]
binding = "CAMPAIGN_ASSETS"
bucket_name = "agapay-campaign-assets"

[[r2_buckets]]
binding = "ANNOUNCEMENT_ASSETS"
bucket_name = "agapay-announcement-assets"

[[r2_buckets]]
binding = "TEACHING_ASSETS"
bucket_name = "agapay-teaching-assets"

# Private voice notes and photos for ministry group messages. Never enable a
# public r2.dev URL; authenticated group routes re-check active membership.
[[r2_buckets]]
binding = "GROUP_MESSAGE_ASSETS"
bucket_name = "agapay-group-message-assets"

# Parish Library PDFs share the existing private member-content bucket under
# a separate prefix and binding. All reads go through an authenticated route.
[[r2_buckets]]
binding = "PARISH_LIBRARY_ASSETS"
bucket_name = "agapay-group-message-assets"

# Private bucket for sales-tax exemption documents. Unlike CAMPAIGN_ASSETS,
# this bucket must NEVER have a public r2.dev URL enabled -- all access goes
# through authenticated Worker routes (src/handlers/tax-exemption.js) that
# stream the object directly. Bucket created via
# `wrangler r2 bucket create agapay-tax-exemption-docs`. See
# docs/reports/tax-exemption-phase3-report-2026-07-05.md for the operational
# checklist (preview/local-dev bucket naming, etc.).
[[r2_buckets]]
binding = "TAX_EXEMPTION_DOCS"
bucket_name = "agapay-tax-exemption-docs"

# Private Wedding and Baptism preparation guides and supporting documents.
# Never enable r2.dev; every read is authorized and streamed by the Worker.
[[r2_buckets]]
binding = "SACRAMENT_DOCUMENTS"
bucket_name = "agapay-sacrament-documents"

# Private evidence for Stripe nonprofit-pricing applications. This is a
# separate legal record from sales-tax exemption and must never expose r2.dev.
[[r2_buckets]]
binding = "NONPROFIT_PRICING_DOCS"
bucket_name = "agapay-nonprofit-pricing-docs"

# Private bucket for annual donor giving-statement PDFs. Same rules as
# TAX_EXEMPTION_DOCS above: no public r2.dev URL, ever -- these are donor
# financial documents. All access goes through authenticated Worker routes
# (src/handlers/giving-statements.js) that stream the object directly.
# Bucket created via `wrangler r2 bucket create agapay-giving-statements`.
[[r2_buckets]]
binding = "GIVING_STATEMENTS"
bucket_name = "agapay-giving-statements"

# Private bucket for Parish Directory person and household photos. Never
# enable public r2.dev access; delivery goes through authenticated Worker
# media routes that re-check directory ownership and privacy.
[[r2_buckets]]
binding = "DIRECTORY_MEDIA"
bucket_name = "agapay-directory-media"

# Private operational backups for per-parish accounting databases and the
# central production D1 export under platform-d1/. Objects are written and
# restored only by backup workflows/runbooks; never expose this bucket
# through r2.dev or an unauthenticated route.
[[r2_buckets]]
binding = "ACCOUNTING_BACKUPS"
bucket_name = "agapay-accounting-backups"

# Private bucket for accounting attachments (bill invoices, journal entry
# support, bank statements, close-packet documents). Never enable a public
# r2.dev URL -- all access goes through authenticated Worker routes that
# re-check parish accounting authorization on every request and stream the
# object directly, same convention as TAX_EXEMPTION_DOCS.
[[r2_buckets]]
binding = "ACCOUNTING_ATTACHMENTS"
bucket_name = "agapay-accounting-attachments"

# Private seven-day portability archives. Public access stays disabled and the
# provider lifecycle rule applies only to parish-exports/.
[[r2_buckets]]
binding = "PARISH_EXPORTS"
bucket_name = "agapay-parish-exports"

# Restricted financial/legal/support copies retained for policy review. This
# bucket intentionally has no blanket lifecycle rule.
[[r2_buckets]]
binding = "PARISH_RETAINED_DATA"
bucket_name = "agapay-parish-retained-data"

# Independent restore/closure authority. authority.json, closures/, and
# completions/ are protected by indefinite R2 bucket-lock rules.
[[r2_buckets]]
binding = "PARISH_CLOSURE_LEDGER"
bucket_name = "agapay-parish-closure-ledger"

[browser]
binding = "BROWSER"

# Accounting release-gate staging is intentionally narrow and isolated from
# every production binding above. It has only the resources required by the
# authenticated accounting gates; do not add general-purpose production
# buckets or Browser Rendering here.
[env.staging]
name = "agapay-site-staging"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.vars]
