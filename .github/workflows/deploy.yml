name: Deploy to Cloudflare Workers

# Package 0.75A (CI Safety): production migrations and deployment now
# depend on the "test" job succeeding first, via GitHub Actions job
# dependencies ("needs:"). If the test job fails, is cancelled, or does not
# complete successfully, the "deploy" job is skipped automatically -- this
# is GitHub Actions' default behavior for a job with an unsatisfied "needs"
# dependency and is not something this file has to implement itself.
#
# See docs/accounting/03-package-0.75a-ci-safety-report.md for the full
# rationale, failure-path analysis, and required manual GitHub repository
# settings.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least-privilege default: nothing in this workflow needs to write to the
# repository (no PR comments, no releases, no packages published).
permissions:
  contents: read

jobs:
  quality-checks:
    name: Parallel quality
    uses: ./.github/workflows/quality-suite.yml

  quality:
    name: Quality
    needs: quality-checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality-checks.result }}
        run: test "$QUALITY_RESULT" = success

  test-suites:
    name: Parallel tests
    uses: ./.github/workflows/test-suite.yml

  test:
    name: Test
    needs: test-suites
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to succeed
        env:
          TEST_RESULT: ${{ needs.test-suites.result }}
        run: test "$TEST_RESULT" = success

  deploy:
    name: Deploy
    needs: [quality, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Only this job -- the one that actually touches production -- is
    # concurrency-limited. The "test" job above is deliberately left
    # unrestricted: it's non-destructive and safe to run in parallel across
    # any number of pushes or pull requests.
    #
    # At most one "agapay-production" run (migration + deploy) is ever in
    # flight. A newer push to main WAITS for an older run to finish rather
    # than cancelling it (cancel-in-progress: false) -- cancelling a run
    # partway through a D1 migration could leave production in an unknown,
    # ambiguous state, which is worse than a short queueing delay.
    concurrency:
      group: agapay-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install release tooling (deterministic)
        run: npm ci

      - name: Validate Cloudflare authentication
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: whoami

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: d1 migrations apply agapay-production --remote --env=""

      - name: Bootstrap existing production accounting migration ledgers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/bootstrap-accounting-migration-ledger.mjs

      - name: Apply St. Fiacre accounting migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: d1 migrations apply ACCOUNTING_DB_ST_FIACRE --remote --env=""

      - name: Apply accounting canary migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: d1 migrations apply ACCOUNTING_DB_PHASE_G_CANARY --remote --env=""

      - name: Migrate wizard-provisioned accounting databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/migrate-managed-accounting.mjs

      - name: Deploy private accounting provisioner
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy --config wrangler.accounting-provisioner.json

      - name: Record deployment timestamp
        shell: bash
        run: echo "AGAPAY_DEPLOYED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy --env="" --var AGAPAY_BUILD_SHA:${{ github.sha }} --var AGAPAY_DEPLOYED_AT:${{ env.AGAPAY_DEPLOYED_AT }}

  post-deploy-accounting-smoke:
    name: Post-deploy accounting smoke
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency:
      group: accounting-health-test-lubbock
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run production route and health smoke
        run: node scripts/prelaunch-checks.mjs --live-only
        env:
          AGAPAY_BASE_URL: https://agapay.app

      - name: Run Test Lubbock authenticated accounting and Stripe health
        run: node scripts/accounting-health-live.mjs
        env:
          TEST_LUBBOCK_PARISH_SESSION: ${{ secrets.TEST_LUBBOCK_PARISH_SESSION }}
          TEST_LUBBOCK_PARISH_PASSWORD: ${{ secrets.TEST_LUBBOCK_PARISH_PASSWORD }}
          TEST_LUBBOCK_TOTP_SECRET: ${{ secrets.TEST_LUBBOCK_TOTP_SECRET }}
          TEST_LUBBOCK_STAFF_PROFILE_ID: ${{ secrets.TEST_LUBBOCK_STAFF_PROFILE_ID }}
          TEST_LUBBOCK_STAFF_PIN: ${{ secrets.TEST_LUBBOCK_STAFF_PIN }}

      - name: Upload post-deploy accounting smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-deploy-accounting-smoke-${{ github.sha }}
          path: artifacts/accounting-health/
          if-no-files-found: error
          retention-days: 30
