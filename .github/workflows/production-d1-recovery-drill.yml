name: Production D1 recovery drill

on:
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agapay-production-d1-recovery-drill
  cancel-in-progress: false

jobs:
  recovery-drill:
    name: Restore latest stored backup into disposable D1
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Download latest stored backup manifest
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p artifacts/production-d1-recovery
          npx wrangler r2 object get "agapay-accounting-backups/platform-d1/latest.json" --remote --file artifacts/production-d1-recovery/latest.json
          node scripts/d1-recovery.mjs inspect-manifest --manifest artifacts/production-d1-recovery/latest.json --max-age-hours 24
          node scripts/d1-recovery.mjs resolve --manifest artifacts/production-d1-recovery/latest.json

      - name: Download and checksum the exact stored backup
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler r2 object get "agapay-accounting-backups/${BACKUP_KEY}" --remote --file artifacts/production-d1-recovery/restore.sql
          npx wrangler r2 object get "agapay-accounting-backups/${CHECKSUM_KEY}" --remote --file artifacts/production-d1-recovery/restore.sha256
          node scripts/d1-recovery.mjs verify-files \
            --manifest artifacts/production-d1-recovery/latest.json \
            --backup artifacts/production-d1-recovery/restore.sql \
            --checksum artifacts/production-d1-recovery/restore.sha256 \
            --max-age-hours 24

      - name: Create isolated disposable D1 database
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          drill_database="agapay-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "DRILL_DATABASE=$drill_database" >> "$GITHUB_ENV"
          echo "DRILL_STARTED_AT_EPOCH_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
          npx wrangler d1 create "$drill_database" --location wnam

      - name: Restore and validate schema and every table row count
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute "$DRILL_DATABASE" --remote --file artifacts/production-d1-recovery/restore.sql --yes
          node scripts/d1-recovery.mjs validate-database \
            --database "$DRILL_DATABASE" \
            --manifest artifacts/production-d1-recovery/latest.json \
            --started-at-epoch-ms "$DRILL_STARTED_AT_EPOCH_MS" \
            --output artifacts/production-d1-recovery/drill-result.json

      - name: Delete isolated drill database
        if: always() && env.DRILL_DATABASE != ''
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 delete "$DRILL_DATABASE" --skip-confirmation

      - name: Upload recovery evidence (never the database payload)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-d1-recovery-evidence-${{ github.run_id }}
          path: |
            artifacts/production-d1-recovery/latest.json
            artifacts/production-d1-recovery/drill-result.json
          if-no-files-found: error
          retention-days: 365

      - name: Record measured recovery result
        if: success()
        run: echo "Latest private R2 backup was restored into an isolated remote D1, checked, compared, and the disposable database was deleted. RPO target 24h; RTO target 8h." >> "$GITHUB_STEP_SUMMARY"
