name: Deploy Accounting Release-Gate Staging

on:
  workflow_dispatch:
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  quality-checks:
    name: Parallel quality
    uses: ./.github/workflows/quality-suite.yml

  quality:
    name: Quality
    needs: quality-checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality-checks.result }}
        run: test "$QUALITY_RESULT" = success

  test-suites:
    name: Parallel tests
    uses: ./.github/workflows/test-suite.yml

  test:
    name: Test
    needs: test-suites
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to succeed
        env:
          TEST_RESULT: ${{ needs.test-suites.result }}
        run: test "$TEST_RESULT" = success

  deploy-staging:
    name: Migrate and deploy staging
    needs: [quality, test]
    runs-on: ubuntu-latest
    concurrency:
      group: agapay-accounting-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install release tooling (deterministic)
        run: npm ci

      - name: Validate Cloudflare authentication
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: whoami

      - name: Apply central staging migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: d1 migrations apply AGAPAY_DB --env staging --remote

      - name: Apply Parish A accounting migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: d1 migrations apply ACCOUNTING_DB_ST_FIACRE --env staging --remote

      - name: Apply Parish B accounting migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: d1 migrations apply ACCOUNTING_DB_RELEASE_GATE_B --env staging --remote

      - name: Apply Aplos onboarding rehearsal migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: d1 migrations apply ACCOUNTING_DB_ONBOARD_APLOS --env staging --remote

      - name: Apply QuickBooks onboarding rehearsal migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: d1 migrations apply ACCOUNTING_DB_ONBOARD_QUICKBOOKS --env staging --remote

      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy --env staging
