name: Ministries Week Staging Smoke

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Deployed staging Worker URL
        required: true
        default: https://agapay-site-staging.joeldunnesq.workers.dev
      environment:
        description: GitHub environment holding the protected parish credentials
        required: true
        default: accounting-release-gates

      include_catalog:
        description: Also verify campaign upload and catalog save with cleanup
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Ministries on the deployed staging candidate
        run: node scripts/parish-this-week-staging-smoke.mjs "$EXPECTED_BUILD"
        env:
          EXPECTED_BUILD: 0fc31956addec36f4eae046f15a9d89b7bae4f8d
          ACCOUNTING_GATE_PARISH_A_ID: ${{ secrets.ACCOUNTING_GATE_PARISH_A_ID }}
          ACCOUNTING_GATE_PARISH_B_ID: ${{ secrets.ACCOUNTING_GATE_PARISH_B_ID }}
          ACCOUNTING_GATE_USER_A_EMAIL: ${{ secrets.ACCOUNTING_GATE_USER_A_EMAIL }}
          ACCOUNTING_GATE_USER_A_PASSWORD: ${{ secrets.ACCOUNTING_GATE_USER_A_PASSWORD }}
          ACCOUNTING_GATE_USER_A_TOTP_SECRET: ${{ secrets.ACCOUNTING_GATE_USER_A_TOTP_SECRET }}

      - name: Install catalog cleanup tooling
        if: inputs.include_catalog
        run: npm ci

      - name: Verify giving catalog with enrolled MFA
        if: inputs.include_catalog
        run: node scripts/parish-giving-catalog-staging-smoke.mjs "${{ inputs.target_url }}"
        env:
          ACCOUNTING_GATE_PARISH_A_ID: ${{ secrets.ACCOUNTING_GATE_PARISH_A_ID }}
          ACCOUNTING_GATE_USER_A_EMAIL: ${{ secrets.ACCOUNTING_GATE_USER_A_EMAIL }}
          ACCOUNTING_GATE_USER_A_PASSWORD: ${{ secrets.ACCOUNTING_GATE_USER_A_PASSWORD }}
          ACCOUNTING_GATE_USER_A_TOTP_SECRET: ${{ secrets.ACCOUNTING_GATE_USER_A_TOTP_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload staging evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: parish-week-staging-smoke-${{ github.run_id }}
          path: artifacts/parish-week-staging-smoke.json
          if-no-files-found: error
          retention-days: 30
