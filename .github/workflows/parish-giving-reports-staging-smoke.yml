name: Sandbox ACH reconciliation verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Confirm the exact staging release
        run: |
          curl --silent --show-error --fail --max-time 10 https://agapay-site-staging.joeldunnesq.workers.dev/api/health |
            jq -e '.ok == true and .version == "b4823a16f005d8fb2054d7e90efcc4328afe0b0f"'
      - name: Scan Stripe sandbox for both original ACH outcomes
        run: node scripts/check-staging-stripe-reconciliation.mjs
        env:
          AGAPAY_MONITOR_CANARY_TOKEN: ${{ secrets.AGAPAY_STAGING_MONITOR_CANARY_TOKEN }}
