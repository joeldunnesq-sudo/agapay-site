name: Production D1 backup

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agapay-production-d1-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export and store private D1 backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export production D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          created_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          backup_file="agapay-production-${stamp}-${GITHUB_RUN_ID}.sql"
          checksum_file="${backup_file}.sha256"
          manifest_file="${backup_file}.manifest.json"
          npx wrangler d1 export agapay-production --remote --skip-confirmation --output "$backup_file"
          # D1 exports can place a child table and its rows before a referenced
          # parent table. Disabling FK enforcement for the import session makes
          # the export directly restorable into a new blank D1 database.
          # prepare-export prepends PRAGMA foreign_keys=OFF; idempotently.
          node scripts/d1-recovery.mjs prepare-export --backup "$backup_file"
          node scripts/d1-recovery.mjs write-checksum --backup "$backup_file" --output "$checksum_file"
          echo "BACKUP_FILE=$backup_file" >> "$GITHUB_ENV"
          echo "CHECKSUM_FILE=$checksum_file" >> "$GITHUB_ENV"
          echo "MANIFEST_FILE=$manifest_file" >> "$GITHUB_ENV"
          echo "BACKUP_CREATED_AT=$created_at" >> "$GITHUB_ENV"

      - name: Prove the export restores locally and create recovery manifest
        shell: bash
        run: |
          node scripts/d1-recovery.mjs capture \
            --database agapay-production \
            --backup "$BACKUP_FILE" \
            --checksum "$CHECKSUM_FILE" \
            --backup-key "platform-d1/$BACKUP_FILE" \
            --checksum-key "platform-d1/$CHECKSUM_FILE" \
            --manifest-key "platform-d1/$MANIFEST_FILE" \
            --created-at "$BACKUP_CREATED_AT" \
            --output "$MANIFEST_FILE"

      - name: Upload encrypted-at-rest backup to private R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler r2 object put "agapay-accounting-backups/platform-d1/${BACKUP_FILE}" --remote --force --file "$BACKUP_FILE"
          npx wrangler r2 object put "agapay-accounting-backups/platform-d1/${CHECKSUM_FILE}" --remote --force --file "$CHECKSUM_FILE"
          npx wrangler r2 object put "agapay-accounting-backups/platform-d1/${MANIFEST_FILE}" --remote --force --content-type application/json --file "$MANIFEST_FILE"
          npx wrangler r2 object put "agapay-accounting-backups/platform-d1/latest.json" --remote --force --content-type application/json --file "$MANIFEST_FILE"

      - name: Download stored objects and verify checksum
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p artifacts/production-d1-backup
          npx wrangler r2 object get "agapay-accounting-backups/platform-d1/${BACKUP_FILE}" --remote --file artifacts/production-d1-backup/readback.sql
          npx wrangler r2 object get "agapay-accounting-backups/platform-d1/${CHECKSUM_FILE}" --remote --file artifacts/production-d1-backup/readback.sha256
          npx wrangler r2 object get "agapay-accounting-backups/platform-d1/latest.json" --remote --file artifacts/production-d1-backup/latest.json
          node scripts/d1-recovery.mjs verify-files \
            --manifest artifacts/production-d1-backup/latest.json \
            --backup artifacts/production-d1-backup/readback.sql \
            --checksum artifacts/production-d1-backup/readback.sha256 \
            --max-age-hours 2

      - name: Record backup result
        run: echo "Private D1 backup was locally restored, uploaded under platform-d1/, downloaded again, and SHA-256 verified. RPO target 24h; RTO target 8h." >> "$GITHUB_STEP_SUMMARY"
