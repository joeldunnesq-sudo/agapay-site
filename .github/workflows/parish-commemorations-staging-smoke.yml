name: Parish Commemorations Staging Smoke

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Deployed staging Worker URL
        required: true
        default: https://agapay-site-staging.joeldunnesq.workers.dev
      environment:
        description: GitHub environment holding the protected parish credentials
        required: true
        default: accounting-release-gates
      include_documents:
        description: Also verify private preparation document upload, isolation, and deletion
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  staging-smoke:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify the parish commemorations dashboard path
        run: node scripts/parish-commemorations-staging-smoke.mjs "${{ inputs.target_url }}"
        env:
          ACCOUNTING_GATE_PARISH_A_ID: ${{ secrets.ACCOUNTING_GATE_PARISH_A_ID }}
          ACCOUNTING_GATE_USER_A_EMAIL: ${{ secrets.ACCOUNTING_GATE_USER_A_EMAIL }}
          ACCOUNTING_GATE_USER_A_PASSWORD: ${{ secrets.ACCOUNTING_GATE_USER_A_PASSWORD }}
          ACCOUNTING_GATE_USER_A_TOTP_SECRET: ${{ secrets.ACCOUNTING_GATE_USER_A_TOTP_SECRET }}

      - name: Verify private preparation documents
        if: inputs.include_documents
        run: node scripts/sacrament-documents-staging-smoke.mjs "${{ inputs.target_url }}"
        env:
          ACCOUNTING_GATE_PARISH_A_ID: ${{ secrets.ACCOUNTING_GATE_PARISH_A_ID }}
          ACCOUNTING_GATE_USER_A_EMAIL: ${{ secrets.ACCOUNTING_GATE_USER_A_EMAIL }}
          ACCOUNTING_GATE_USER_A_PASSWORD: ${{ secrets.ACCOUNTING_GATE_USER_A_PASSWORD }}
          ACCOUNTING_GATE_USER_A_TOTP_SECRET: ${{ secrets.ACCOUNTING_GATE_USER_A_TOTP_SECRET }}
          ACCOUNTING_GATE_PARISH_B_ID: ${{ secrets.ACCOUNTING_GATE_PARISH_B_ID }}
          ACCOUNTING_GATE_USER_B_EMAIL: ${{ secrets.ACCOUNTING_GATE_USER_B_EMAIL }}
          ACCOUNTING_GATE_USER_B_PASSWORD: ${{ secrets.ACCOUNTING_GATE_USER_B_PASSWORD }}
          ACCOUNTING_GATE_USER_B_TOTP_SECRET: ${{ secrets.ACCOUNTING_GATE_USER_B_TOTP_SECRET }}

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parish-commemorations-staging-smoke-${{ github.run_id }}
          path: |
            artifacts/parish-commemorations-staging-smoke.json
            artifacts/sacrament-documents-staging-smoke.json
          if-no-files-found: error
          retention-days: 30
